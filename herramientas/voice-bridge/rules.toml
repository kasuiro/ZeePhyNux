# voice-bridge prototype defaults.
# Credentials are NEVER stored here: env vars or 0600 files in
# ~/.config/voice-bridge/{key,cf_token,cf_account}.

[api]
# Transient upstream errors: 429/5xx and network failures are retried with
# exponential backoff. Retry-After from the provider is honoured, capped below.
retry_attempts = 3
retry_base_seconds = 2
retry_max_seconds = 8

[stt]
provider = "whisper"             # whisper (local, default) | vosk | cloudflare | groq
language = "auto"                # auto detects es/en; es/en selectable
timeout = 120
hint = "OpenCode, Hyprland, Questline, linux zeep, PipeWire, MCP, voice-bridge, push to talk"

[stt.providers.whisper]
# faster-whisper 1.2.1 + av 14.4.0 in a venv under ~/.local/state (never /repo).
model = "base"                   # base int8 ≈ latency de Vosk, mejor precisión
compute_type = "int8"
cpu_threads = 4
beam_size = 5
vad_filter = true
python = "~/.local/state/voice-bridge/whisper/venv/bin/python"
hf_home = "~/.local/state/voice-bridge/whisper/hf"
timeout = 120

[stt.providers.vosk]
# One-shot contract: capture.wav is mounted read-only; the container has no
# network and prints {"text": ..., "engine": "vosk"} to stdout.
image = "voice-bridge-vosk-es:0.42"
image_en = "voice-bridge-vosk-en:0.15"
model = "vosk-model-small-es-0.42"
model_en = "vosk-model-small-en-us-0.15"
network = "none"                 # no egress from the STT container

[stt.providers.cloudflare]
model = "@cf/openai/whisper"
endpoint = "https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/run/@cf/openai/whisper"

[stt.providers.groq]
model = "whisper-large-v3-turbo"
endpoint = "https://api.groq.com/openai/v1/audio/transcriptions"

[tts]
provider = "piper"               # piper (local, default) | cloudflare
model_es = "@cf/deepgram/aura-2-es"
model_en = "@cf/deepgram/aura-2-en"
endpoint = "https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/run/{model}"
speaker = "aquila"               # fallback for es
speaker_es = "aquila"            # Deepgram Aura-2 es
speaker_en = "asteria"           # Deepgram Aura-2 en
encoding = "mp3"
timeout = 30
max_chars = 2000
player = "pw-play"

[tts.providers.piper]
# piper-tts 1.8.0 in a venv under ~/.local/state; voices are 63 MB each.
python = "~/.local/state/voice-bridge/piper/venv/bin/python"
data_dir = "~/.local/state/voice-bridge/piper/models"
voice_es = "es_ES-davefx-medium"
voice_en = "en_US-lessac-medium"
timeout = 60

[voice]
# Bilingual spoken replies: auto follows the detected language, or force es/en.
language = "auto"                # auto | es | en
speaker_es = "aquila"            # Deepgram Aura-2 es
speaker_en = "asteria"           # Deepgram Aura-2 en
rate = 1.0                       # 0.5–2.0; applied locally with ffmpeg atempo

[record]
rate = 16000
channels = 1
format = "s16"
max_seconds = 60

[deliver]
# tty    -> type the transcript into the focused kitty window (Wayland-native)
# clipboard -> copy to the clipboard only; the user pastes it
# none   -> keep the transcript in last.txt only
backend = "tty"
suffix = "\r"

[paths]
state = "/home/dev/.local/state/voice-bridge"

[wake]
# Hands-free trigger, one listener per user session (exception to RULES.md 8).
# voicectl wake-start/wake-stop own the process; no socket, no network, no unit.
# Validated in T2 with whisper base + initial_prompt/hotwords; "zeep" is kept.
enabled = true
phrases = ["oye zeep", "oye linux zeep"]
language = "es"
initial_prompt = "Contexto: linux zeep. Comando: oye zeep."
hotwords = "zeep"
beam_size = 1
best_of = 1
max_new_tokens = 40
vad_filter = true
condition_on_previous_text = false
# Raw PCM framing (stdlib array, no WAV on disk for the detector).
energy_threshold = 300
noise_factor = 2.0               # adaptive: threshold >= room noise floor x 2
min_utterance_seconds = 1.0
max_utterance_seconds = 6.0
silence_timeout = 0.8
pad_seconds = 0.5
cooldown_seconds = 3
# Dictation after the trigger: end on silence, hard cap for false positives.
confirm = true
confirm_text = "Escuchando"
dictate_silence_timeout = 1.2
dictate_min_seconds = 0.5
dictate_max_seconds = 30
